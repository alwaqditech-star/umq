services:
  postgres:
    image: postgres:16-alpine
    container_name: umq-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: umq
      POSTGRES_PASSWORD: umq_dev_password
      POSTGRES_DB: umq_platform
    volumes:
      - umq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umq -d umq_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umq_postgres_data:
